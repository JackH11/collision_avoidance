[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collision-avoidance"
version = "0.5.0"
description = "Gymnasium collision-avoidance env with grid obs and CNN policies"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

[project.scripts]
ca-train = "collision_avoidance.train.train:main"
ca-eval = "collision_avoidance.eval.eval_policy:main"
ca-demo = "collision_avoidance.demo.main:main"
ca-dump = "collision_avoidance.demo.dump_trajectory:main"

[tool.setuptools.packages.find]
include = ["collision_avoidance*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
]
